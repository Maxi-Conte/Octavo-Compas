<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de ropa</title>
  <meta name="description" content="Ropa para moverte: remeras, buzos, pantalones y más. Envíos a todo el país.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/comun.js" defer></script>
  <script src="/js/inicio.js" defer></script>
</head>
<body>
  <header id="header"></header>

  <main>
    <section class="hero">
      <div class="contenedor">
        <div class="hero-contenido">
          <h1>Nueva temporada</h1>
          <p>Prendas cómodas, pensadas para el día a día. Envíos a todo el país y hasta 12 cuotas.</p>
          <a class="boton" href="/tienda.html">Ver colección</a>
        </div>
      </div>
    </section>

    <section class="seccion contenedor">
      <div class="seccion-titulo"><h2>Categorías</h2></div>
      <div class="categorias-destacadas" id="categorias-inicio"></div>
    </section>

    <section class="seccion contenedor">
      <div class="seccion-titulo">
        <h2>Destacados</h2>
        <a href="/tienda.html">Ver todo</a>
      </div>
      <div class="grilla" id="destacados"></div>
    </section>

    <section class="contenedor">
      <div class="beneficios" id="beneficios">
        <div><strong>Envíos a todo el país</strong><span id="texto-envio">Rápidos y seguros</span></div>
        <div><strong>Hasta 12 cuotas</strong><span>Pagá con Mercado Pago</span></div>
        <div><strong>Cambios fáciles</strong><span>30 días para cambiar tu talle</span></div>
      </div>
    </section>

    <section class="seccion contenedor">
      <div class="seccion-titulo">
        <h2>Ofertas</h2>
        <a href="/tienda.html?ofertas=1">Ver todas</a>
      </div>
      <div class="grilla" id="ofertas"></div>
    </section>
  </main>

  <footer id="footer"></footer>
</body>
</html>
